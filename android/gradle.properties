# Engada Pochu — Gradle settings.
# Tuned for low-memory machines (4 GB RAM laptops) and CI runners.

# Gradle daemon memory.
org.gradle.jvmargs=-Xmx1024m -XX:MaxMetaspaceSize=384m -XX:+UseSerialGC
# Single worker: predictable memory on small machines.
org.gradle.workers.max=1
# No parallel builds on low-spec machines.
org.gradle.parallel=false
# Run the Kotlin compiler in-process (no separate daemon → less RAM).
kotlin.compiler.execution.strategy=in-process

# AndroidX package structure
android.useAndroidX=true
